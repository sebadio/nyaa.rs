[package]
name = "nyaa-rs"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["nyaa", "qbittorrent"]

[dependencies]
chrono = "0.4.45"
dirs = "6.0.0"
env_logger = "0.11.11"
humansize = "2.1.3"
iced = { git = "https://github.com/iced-rs/iced", branch = "master", features = ["tokio", "debug", "sipper", "image"] }
iced_fonts = { git = "https://github.com/Redhawk18/iced_fonts", branch = "master", features = ["lucide"] }
log = "0.4.33"
nyaa = { version = "0.1.0", path = "nyaa" }
open = "5.4.0"
qbittorrent = { version = "0.1.0", path = "qbittorrent" }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.19"
tokio = { version = "1.53.1" }
toml = "1.1.4"

[patch.crates-io]
iced_core = { git = "https://github.com/iced-rs/iced", branch = "master" }
