[package]
name = "nyaa-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
dirs = "6.0.0"
env_logger = "0.11.11"
humansize = "2.1.3"
iced = { version = "0.14.0", features = ["tokio", "debug", "sipper"] }
iced_fonts = { version = "0.3.0", features = ["full"] }
log = "0.4.33"
open = "5.4.0"
quick-xml = { version= "0.41.0", features = ["serialize"] }
reqwest = { version = "0.13.4", features = ["json", "cookies", "form", "multipart", "query"] }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.19"
tokio = { version = "1.53.1" }
toml = "1.1.4"
